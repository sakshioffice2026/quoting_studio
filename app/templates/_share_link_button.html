{% macro share_link_button(resource_type, resource_id) %}
<div class="share-link-box" data-share
     data-create="{{ url_for('share.create_link', resource_type=resource_type, resource_id=resource_id) }}"
     data-regenerate="{{ url_for('share.regenerate_link', resource_type=resource_type, resource_id=resource_id) }}"
     data-revoke="{{ url_for('share.revoke_link', resource_type=resource_type, resource_id=resource_id) }}"
     data-csrf="{{ csrf_token() }}"
     style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
  <button type="button" class="btn btn-secondary btn-sm" data-share-copy>Copy link to send to customer</button>
  <button type="button" class="btn btn-secondary btn-sm" data-share-regen title="Invalidate the old link and create a new one">Regenerate</button>
  <button type="button" class="btn btn-secondary btn-sm" data-share-revoke title="Disable the current link">Revoke</button>
  <span class="muted" data-share-status style="font-size:12px;"></span>
</div>
{% endmacro %}

{% macro share_link_script() %}
<script>
(function () {
  if (window.__shareLinkInit) return;
  window.__shareLinkInit = true;

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); }
      catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function post(box, url) {
    return fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'X-CSRFToken': box.dataset.csrf, 'Accept': 'application/json' }
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || 'Request failed');
        return j;
      });
    });
  }

  function setStatus(box, text, isError) {
    var el = box.querySelector('[data-share-status]');
    el.textContent = text || '';
    el.style.color = isError ? '#A1372B' : '';
  }

  function describe(j) {
    var parts = [j.state];
    if (j.views) parts.push(j.views + ' view' + (j.views === 1 ? '' : 's'));
    if (j.expires_at) parts.push('expires ' + j.expires_at);
    return parts.join(' · ');
  }

  function issue(box, url, btn, label) {
    var original = btn.textContent;
    btn.disabled = true;
    post(box, url)
      .then(function (j) {
        return copyText(j.url).then(function () {
          btn.textContent = 'Link copied!';
          setStatus(box, describe(j), false);
        }, function () {
          window.prompt('Copy this link:', j.url);
          setStatus(box, describe(j), false);
        });
      })
      .catch(function (e) { setStatus(box, e.message, true); })
      .then(function () {
        setTimeout(function () { btn.textContent = original; btn.disabled = false; }, 1500);
      });
  }

  document.addEventListener('click', function (e) {
    var copyBtn   = e.target.closest('[data-share-copy]');
    var regenBtn  = e.target.closest('[data-share-regen]');
    var revokeBtn = e.target.closest('[data-share-revoke]');
    var btn = copyBtn || regenBtn || revokeBtn;
    if (!btn) return;
    var box = btn.closest('[data-share]');

    if (copyBtn) {
      issue(box, box.dataset.create, copyBtn);
    } else if (regenBtn) {
      if (!confirm('The previous link will stop working. Create a new one?')) return;
      issue(box, box.dataset.regenerate, regenBtn);
    } else if (revokeBtn) {
      if (!confirm('Disable the current link? The customer will no longer be able to open it.')) return;
      post(box, box.dataset.revoke)
        .then(function () { setStatus(box, 'Link revoked', false); })
        .catch(function (err) { setStatus(box, err.message, true); });
    }
  });
})();
</script>
{% endmacro %}
