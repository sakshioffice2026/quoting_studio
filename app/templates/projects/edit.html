{% extends 'base.html' %}
{% block title %}Edit {{ project.customer_name }} — Quoting Studio{% endblock %}

{% block body %}
<div class="page-wrap" style="max-width:600px;">
  <div class="page-header">
    <div>
      <h1>Edit project</h1>
      <div class="sub mono">{{ project.customer_name }}</div>
    </div>
    <a href="{{ url_for('projects.detail', project_id=project.id) }}" class="btn btn-secondary btn-sm">← Back</a>
  </div>

  <div style="background:white;border:1px solid var(--line);border-radius:6px;padding:28px;">
    <form method="POST" action="{{ url_for('projects.edit', project_id=project.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="customer_name">Customer name</label>
        <input class="form-control" type="text" id="customer_name" name="customer_name"
               value="{{ project.customer_name }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="address">Address</label>
        <input class="form-control" type="text" id="address" name="address"
               value="{{ project.address or '' }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Notes</label>
        <textarea class="form-control" id="notes" name="notes">{{ project.notes or '' }}</textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="status">Status</label>
        <select class="form-control" id="status" name="status">
          {% for s in statuses %}
          <option value="{{ s }}" {{ 'selected' if project.status == s }}>{{ labels[s] }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="divider"></div>
      <div class="flex gap-8" style="justify-content:flex-end;">
        <a href="{{ url_for('projects.detail', project_id=project.id) }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
