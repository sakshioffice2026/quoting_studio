{% extends 'base.html' %}
{% block title %}New Project — Quoting Studio{% endblock %}

{% block body %}
<div class="page-wrap" style="max-width:600px;">
  <div class="page-header">
    <div>
      <h1>New project</h1>
      <div class="sub mono">Customer details</div>
    </div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary btn-sm">← Back</a>
  </div>

  <div style="background:white;border:1px solid var(--line);border-radius:6px;padding:28px;">
    <form method="POST" action="{{ url_for('projects.new') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="customer_name">Customer name <span class="copper">*</span></label>
        <input class="form-control" type="text" id="customer_name" name="customer_name"
               value="{{ request.form.get('customer_name', '') }}"
               placeholder="J. Harwood" autofocus required>
      </div>

      <div class="form-group">
        <label class="form-label" for="address">Property address</label>
        <input class="form-control" type="text" id="address" name="address"
               value="{{ request.form.get('address', '') }}"
               placeholder="14 Mill Lane, Bristol BS1 4QT">
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Notes</label>
        <textarea class="form-control" id="notes" name="notes"
                  placeholder="e.g. Replace 6 windows and rear bifold door.">{{ request.form.get('notes', '') }}</textarea>
      </div>

      <div class="divider"></div>

      <div class="flex gap-8" style="justify-content:flex-end;">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Create project →</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
