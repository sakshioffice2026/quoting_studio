{% extends 'base.html' %}
{% block title %}{{ window.label }} — Designer — Quoting Studio{% endblock %}

{% block head %}
<meta name="csrf-token" content="{{ csrf_token() }}">
<script src="{{ url_for('static', filename='js/utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/drawing-engine.js') }}"></script>
<script src="{{ url_for('static', filename='js/drawing-layer-fix.js') }}"></script>
<script src="{{ url_for('static', filename='js/drawing-phase2.js') }}"></script>
<script src="{{ url_for('static', filename='js/drawing-phase3.js') }}"></script>
<style>
body { overflow:hidden; }
.app-main { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; }
.dz { display:flex; flex-direction:column; width:100%; flex:1; min-height:0; position:static; }

/* top framebar */
.dz-top { display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;background:var(--navy);flex-shrink:0; }
.dz-crumb { font-family:var(--font-mono);font-size:12px;color:#B7C0CE; }
.dz-crumb a { color:#B7C0CE;text-decoration:none; }
.dz-actions { display:flex;gap:7px;align-items:center; }

/* config tab nav (Framepoint style) */
.dz-nav { display:flex;background:#FCFBF8;border-bottom:1px solid var(--line);
  padding:0 12px;flex-shrink:0; }
.dz-tab { padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--steel);cursor:pointer;border-bottom:2px solid transparent; }
.dz-tab:hover { color:var(--navy); }
.dz-tab.on { color:var(--copper);border-bottom-color:var(--copper); }

/* body */
.dz-body { display:flex;flex:1;overflow:hidden;min-height:0; }

/* tool rail */
.dz-rail { width:52px;background:var(--navy);display:flex;flex-direction:column;
  align-items:center;padding:12px 0;gap:3px;flex-shrink:0; }
.dz-tool { width:38px;height:38px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;color:#9AA4B8;font-size:16px;cursor:pointer;border:none;
  background:transparent;position:relative; }
.dz-tool.on { background:var(--copper);color:white; }
.dz-tool:hover:not(.on){ background:#2A3445; }
.dz-tool .tip { position:absolute;left:46px;background:var(--navy);color:var(--paper);
  font-family:var(--font-mono);font-size:10px;padding:4px 8px;border-radius:3px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50; }
.dz-tool:hover .tip{ opacity:1; }
.dz-sep{ width:26px;height:1px;background:#2A3445;margin:5px 0; }

/* 3D Tools trigger — prominent top-of-rail card */
.dz-body{ position:relative; }
.dz-3dtrigger{ position:relative;width:40px;height:40px;border-radius:8px;
  background:#1E222A;border:1px solid #343B48;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:#E8EAED;font-size:18px;margin-bottom:8px; }
.dz-3dtrigger:hover{ border-color:var(--copper); }
.dz-3dtrigger.on{ border-color:var(--copper);
  box-shadow:0 0 0 2px rgba(201,123,61,.30),0 0 12px rgba(201,123,61,.45);color:var(--copper); }
.dz-3dtrigger .badge{ position:absolute;right:-8px;top:-7px;background:var(--copper);color:#fff;
  font-size:7px;font-weight:700;letter-spacing:.03em;padding:2px 4px;border-radius:4px; }
.dz-3dtrigger .tip{ position:absolute;left:46px;top:8px;background:var(--navy);color:var(--paper);
  font-family:var(--font-mono);font-size:10px;padding:4px 8px;border-radius:3px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50; }
.dz-3dtrigger:hover .tip{ opacity:1; }

/* 3D options drawer */
.dz-3dpanel{ position:absolute;left:52px;top:0;bottom:0;width:250px;background:#FCFBF8;
  border-right:1px solid var(--line);box-shadow:2px 0 14px rgba(0,0,0,.10);z-index:150;
  display:none;padding:10px 0; }
.dz-3dpanel.show{ display:block; }
.dz-3dpanel-hd{ padding:8px 16px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--steel);border-bottom:1px solid var(--line);margin-bottom:8px; }
.dz-3dopt{ display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
  font-size:13px;color:var(--navy);border-radius:7px;margin:6px 8px;
  background:white;border:1px solid var(--line);transition:background .12s,color .12s,border-color .12s; }
.dz-3dopt:hover{ background:#1E222A;color:#fff;border-color:#343B48; }
.dz-3dopt.primary{ border-left:3px solid var(--copper);font-weight:600; }
.dz-3dopt .ic{ width:20px;text-align:center;flex-shrink:0;font-size:15px; }

/* canvas */
.dz-canvas-wrap { flex:1;position:relative;overflow:hidden;
  background:#FCFBF8;min-width:0; }
#dzsvg { width:100%;height:100%;display:block; }
.dz-hud { position:absolute;top:12px;left:12px;display:flex;gap:8px;pointer-events:none; }
