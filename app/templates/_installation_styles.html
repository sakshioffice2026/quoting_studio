<style>
  .badge-inst-scheduled   { background: #EFEAE0; color: #8A7A5A; }
  .badge-inst-in-progress { background: #E8EEF5; color: var(--navy); }
  .badge-inst-snag        { background: #FBF1DC; color: var(--warning); }
  .badge-inst-completed   { background: var(--navy); color: var(--paper); }

  .inst-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .inst-chip { font-size:12px; padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--steel); }
  .inst-chip strong { color:var(--navy); margin-right:4px; }
  .inst-chip.main { background:var(--navy); border-color:var(--navy); color:#fff; }
  .inst-chip.main strong { color:#fff; }
  .inst-chip.ready { border-color:var(--sage); color:var(--sage); }
  .inst-chip.warn { border-color:var(--warning); color:var(--warning); }

  .inst-bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:14px; display:flex; }
  .inst-bar span { display:block; height:100%; }
  .inst-bar .b-installed { background:var(--navy); }
  .inst-bar .b-scheduled { background:#5B7DB1; }

  .inst-pill { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; }
  .inst-pill.pending { background:#F0EEEA; color:var(--steel); }
  .inst-pill.pass    { background:#E4EDE9; color:var(--sage); }
  .inst-pill.snag    { background:#FBF1DC; color:var(--warning); }

  .inst-card { border:1px solid var(--line); border-radius:8px; background:#fff; padding:16px; margin-bottom:14px; }
  .inst-card.snag { border-color:var(--warning); background:#FDF8EC; }
  .inst-card.pass { border-color:var(--sage); background:#F3FAF6; }
  .inst-card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:12px; flex-wrap:wrap; }
  .inst-card-title { font-weight:700; color:var(--navy); font-size:14px; }
  .inst-checks { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:12px; font-size:13px; }
  .inst-checks label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .inst-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  @media (max-width:640px) { .inst-grid { grid-template-columns:1fr; } }
</style>
